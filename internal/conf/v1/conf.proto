syntax = "proto3";

package conf.v1;

option go_package = "github.com/zhangzhe-ctrl/ani-resource-service/internal/conf/v1;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Network network = 2;
  Image image = 3;
}

// Independent Image connections and private secret files. Disabled Image has
// no new startup dependency. The existing Network fields and tags are stable.
message Image {
  bool enabled = 1;
  string database_dsn_file = 2;
  string installation_id = 3;
  string harbor_url = 4;
  string harbor_ca_file = 5;
  string harbor_username = 6;
  string harbor_password_file = 7;
  string robot_name_prefix = 8;
  string platform_project = 9;
  string encryption_keys_file = 10;
  string cursor_signing_key_file = 11;
  google.protobuf.Duration request_timeout = 12;
  int64 publisher_days = 13;
  int64 pull_days = 14;
  bool allow_never_expires = 15;
}

message Network {
  string database_dsn = 1;
  // Empty uses Kubernetes in-cluster service account credentials.
  string kubeconfig = 2;
  string cluster_id = 3;
  string namespace_prefix = 4;
  // Base64 encoded secret, at least 32 bytes, shared by service replicas.
  string cursor_signing_key = 5;
  Worker worker = 6;
  // Fixed instance owner RPC target. Empty keeps attachments conservatively occupied.
  string instance_consumer_endpoint = 7;
  Observation observation = 8;
  // The isolated acceptance instance only. Runtime recovery stays enabled
  // for accepted LB tasks even when this RPC admission switch is closed.
  LoadBalancer load_balancer = 9;
  // Restart applies changes. Empty rejects first acceptance of new VPCs.
  repeated string vpc_cidr_presets = 10;
}

message LoadBalancer {
  bool enable_isolated_api = 1;
  string installation_fingerprint = 2;
  string controller_image_id = 3;
  string envoy_image_id = 4;
  string shutdown_image_id = 5;
  string kc_image_id = 6;
}

message Observation {
  google.protobuf.Duration audit_interval = 1;
  google.protobuf.Duration audit_jitter = 2;
  google.protobuf.Duration audit_timeout = 3;
  google.protobuf.Duration flush_interval = 4;
  uint32 queue_capacity = 5;
  uint32 workers_per_kind = 6;
  uint32 request_qps = 7;
  uint32 request_burst = 8;
}

message Worker {
  google.protobuf.Duration lease = 1;
  google.protobuf.Duration request_timeout = 2;
  google.protobuf.Duration observe_every = 3;
  google.protobuf.Duration stale_after = 4;
  google.protobuf.Duration retry_min = 5;
  google.protobuf.Duration retry_max = 6;
  google.protobuf.Duration poll_interval = 7;
}

message Server {
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }

  message Admin {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }

  GRPC grpc = 1;
  Admin admin = 2;
  google.protobuf.Duration shutdown_timeout = 3;
}
