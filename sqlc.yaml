version: "2"
sql:
  - engine: postgresql
    schema: migrations/instance
    queries: internal/data/instance/queries
    gen:
      go:
        package: sqlcgen
        out: internal/data/instance/sqlcgen
        omit_unused_structs: true
        sql_package: pgx/v5
        emit_empty_slices: true
        query_parameter_limit: 0
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
  - engine: postgresql
    schema:
      - migrations/0001_vpc.sql
      - migrations/0002_subnet.sql
      - migrations/0003_attachment.sql
      - migrations/0004_observation.sql
      - migrations/0005_vpc_egress.sql
      - migrations/0006_vpc_base_connectivity.sql
      - migrations/0007_load_balancers.sql
      - migrations/0008_lb_health_check_port.sql
      - migrations/0009_lb_fixed_flavors.sql
      - migrations/0010_lb_listeners.sql
      - migrations/0011_subnet_ip_counts.sql
      - migrations/0012_lb_listener_parameters.sql
      - migrations/0013_subnet_ip_ranges.sql
      - migrations/0014_lb_deferred_activation.sql
      - migrations/0015_controller_managed_attachments.sql
      - migrations/0016_virtual_switches.sql
      - migrations/0017_legacy_device_retirement.sql
      - migrations/0018_default_vpc_egress.sql
      - migrations/0019_vm_networks.sql
      - migrations/0020_managed_pool_gateway.sql
      - migrations/0021_optional_public_pool_verification.sql
      - migrations/0022_default_egress_eip_identity.sql
      - migrations/0023_security_groups.sql
      - migrations/0024_vpc_provider_readiness.sql
      - migrations/0025_tenant_namespace_uid.sql
      - migrations/0026_lb_dedicated_envoy_proxy.sql
      - migrations/0027_optional_intranet_pool_verification.sql
      - migrations/0028_attachment_consumer_type.sql
      - migrations/0029_manual_vnics.sql
      - migrations/0030_vnic_requested_addresses.sql
      - migrations/0031_subnet_creation_options.sql
      - migrations/0032_network_management_simplification.sql
    queries: internal/data/network/queries
    gen:
      go:
        package: sqlcgen
        out: internal/data/network/sqlcgen
        sql_package: pgx/v5
        emit_empty_slices: true
        query_parameter_limit: 0
        overrides:
          - column: network_security_group_reconciliations.next_run_at
            go_type:
              import: github.com/jackc/pgx/v5/pgtype
              type: Timestamptz
          - column: network_default_vpc_egresses.next_run_at
            go_type:
              import: github.com/jackc/pgx/v5/pgtype
              type: Timestamptz
          - column: network_attachments.next_check_at
            go_type:
              import: github.com/jackc/pgx/v5/pgtype
              type: Timestamptz
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: uuid
            go_type: string
          - db_type: uuid
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
  - engine: postgresql
    schema: migrations/image
    queries: internal/data/image/queries
    gen:
      go:
        package: sqlcgen
        out: internal/data/image/sqlcgen
        sql_package: pgx/v5
        emit_empty_slices: true
        query_parameter_limit: 0
        overrides:
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: uuid
            go_type: string
          - db_type: uuid
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
