# NET-05A captured metadata contains public resource IDs, idempotency keys
# and Kubernetes Secret names. These are not Secret data or credentials.
# Keep default rules; the exception requires this evidence path AND an exact
# reviewed JSON property/value line. No directory-wide or rule-wide exclusion.
[extend]
useDefault = true

[[allowlists]]
description = "Exact reviewed NET-05A fixture metadata, preserving original evidence hashes"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^docs/execution/records/NET-05A/live/.*\.json$''']
regexTarget = "line"
regexes = [
