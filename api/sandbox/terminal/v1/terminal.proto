syntax = "proto3";
package sandbox.terminal.v1;
option go_package = "github.com/zhangzhe-ctrl/ani-resource-service/api/sandbox/terminal/v1;terminalv1";

service SandboxTerminalService {
  rpc ResolveTerminalSession(ResolveTerminalSessionRequest) returns (SandboxTerminalBinding);
  rpc ValidateTerminalSession(SandboxTerminalBinding) returns (TerminalSessionValidation);
}
message ResolveTerminalSessionRequest { string tenant_id = 1; string sandbox_id = 2; }
message SandboxTerminalBinding {
  string tenant_id = 1;
  string sandbox_id = 2;
  int64 version = 3;
  string cluster_id = 4;
  string namespace = 5;
  string namespace_uid = 6;
  string pod_name = 7;
  string pod_uid = 8;
  string container_name = 9;
  string shell = 10;
}
message TerminalSessionValidation { bool valid = 1; }
