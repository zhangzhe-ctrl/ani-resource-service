syntax = "proto3";

package sandbox.v1;

option go_package = "github.com/zhangzhe-ctrl/ani-resource-service/api/sandbox/v1;sandboxv1";

import "google/protobuf/timestamp.proto";

// Resource exposes this trusted service only to the Governance BFF. The
// public HTTP route remains owned by Governance.
service SandboxService {
  // Internal Governance background facts, never public user delegation.
  rpc OpenTenantSpace(OpenTenantSpaceRequest) returns (OpenTenantSpaceResponse);
  rpc CloseTenantSpace(CloseTenantSpaceRequest) returns (CloseTenantSpaceResponse);
  rpc GetTenantSpace(GetTenantSpaceRequest) returns (GetTenantSpaceResponse);
  rpc ResolveCreateSpec(ResolveCreateSpecRequest) returns (ResolveCreateSpecResponse);
  rpc AcceptCreate(AcceptCreateRequest) returns (AcceptCreateResponse);
  rpc AcceptSandboxClone(AcceptSandboxCloneRequest) returns (AcceptSandboxCloneResponse);
  rpc RestoreSandboxCheckpoint(RestoreSandboxCheckpointRequest) returns (RestoreSandboxCheckpointResponse);
  rpc GetSandbox(GetSandboxRequest) returns (GetSandboxResponse);
  rpc ListSandboxes(ListSandboxesRequest) returns (ListSandboxesResponse);
  rpc ListSandboxPodHistory(ListSandboxPodHistoryRequest) returns (ListSandboxPodHistoryResponse);
  rpc GetOperation(GetOperationRequest) returns (GetOperationResponse);
  rpc ListOperations(ListOperationsRequest) returns (ListOperationsResponse);
  rpc ListSandboxEvents(ListSandboxEventsRequest) returns (ListSandboxEventsResponse);
  rpc ListSandboxSecurityEvents(ListSandboxSecurityEventsRequest) returns (ListSandboxSecurityEventsResponse);
  rpc ListSandboxCheckpoints(ListSandboxCheckpointsRequest) returns (ListSandboxCheckpointsResponse);
  rpc CreateSandboxCheckpoint(CreateSandboxCheckpointRequest) returns (CreateSandboxCheckpointResponse);
  rpc GetSandboxEgress(GetSandboxEgressRequest) returns (GetSandboxEgressResponse);
  rpc StreamSandboxLogs(StreamSandboxLogsRequest) returns (stream StreamSandboxLogsResponse);
  rpc ListEnvironmentVariables(ListEnvironmentVariablesRequest) returns (ListEnvironmentVariablesResponse);
  rpc Pause(PauseRequest) returns (PauseResponse);
  rpc Resume(ResumeRequest) returns (ResumeResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc RunCode(RunCodeRequest) returns (RunCodeResponse);
  rpc GetCodeRun(GetCodeRunRequest) returns (GetCodeRunResponse);
  rpc QueryFiles(QueryFilesRequest) returns (QueryFilesResponse);
  rpc MutateFiles(MutateFilesRequest) returns (MutateFilesResponse);
  rpc GetFileOperation(GetFileOperationRequest) returns (GetFileOperationResponse);
  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);
  rpc OpenPreview(OpenPreviewRequest) returns (OpenPreviewResponse);
  rpc ClosePreview(ClosePreviewRequest) returns (ClosePreviewResponse);
  rpc ListPreviews(ListPreviewsRequest) returns (ListPreviewsResponse);
  rpc GetPreviewOperation(GetPreviewOperationRequest) returns (GetPreviewOperationResponse);
}

message CreateSandboxCheckpointRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  string name = 3;
  string idempotency_key = 4 [json_name = "idempotency_key"];
  int64 expected_version = 5 [json_name = "expected_version"];
}
message CreateSandboxCheckpointResponse {
  string checkpoint_id = 1 [json_name = "checkpoint_id"];
  string operation_id = 2 [json_name = "operation_id"];
  string state = 3;
  bool replayed = 4;
}

message ListSandboxCheckpointsRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  uint32 page = 3;
  uint32 page_size = 4 [json_name = "page_size"];
}
message SandboxCheckpoint {
  string id = 1;
  string name = 2;
  string status = 3;
  string reason = 4;
  string scope = 5;
  int64 size_bytes = 6 [json_name = "size_bytes"];
  bool size_known = 7 [json_name = "size_known"];
  string created_at = 8 [json_name = "created_at"];
  string provider_status = 9 [json_name = "provider_status"];
}
message ListSandboxCheckpointsResponse {
  repeated SandboxCheckpoint items = 1;
  int64 total = 2;
  string source = 3;
}

// Experimental NodePort: no additional ingress authentication. All network
// reachable cluster nodes may expose the allocated port, not just address.
message OpenPreviewRequest {
  string tenant_id = 1; string sandbox_id = 2; string preview_id = 3;
  string operation_id = 4; string idempotency_key = 5; int64 expected_version = 6;
  uint32 port = 7; string protocol = 8; uint32 ttl_seconds = 9;
}
message ClosePreviewRequest {
  string tenant_id = 1; string sandbox_id = 2; string preview_id = 3;
  string operation_id = 4; string idempotency_key = 5; int64 expected_version = 6;
}
message ListPreviewsRequest { string tenant_id = 1; string sandbox_id = 2; uint32 page = 3; uint32 page_size = 4; }
message GetPreviewOperationRequest { string tenant_id = 1; string sandbox_id = 2; string operation_id = 3; }
message Preview {
  string preview_id = 1; string sandbox_id = 2; uint32 port = 3; string protocol = 4;
  string state = 5; string reason = 6; string address = 7; string desired = 8;
  google.protobuf.Timestamp expires_at = 9; bool replayed = 10;
}
message OpenPreviewResponse { Preview preview = 1; string operation_id = 2; }
message ClosePreviewResponse { Preview preview = 1; string operation_id = 2; }
message ListPreviewsResponse { repeated Preview items = 1; int64 total = 2; }
message GetPreviewOperationResponse {
  string operation_id = 1; string preview_id = 2; string action = 3; string state = 4; string reason = 5;
  google.protobuf.Timestamp created_at = 6; google.protobuf.Timestamp completed_at = 7;
}

// A point-in-time snapshot of the standard Kubernetes NetworkPolicy egress
// declarations selecting the running Pod. Enforcement and FQDN allowlists
// are not available from these declarations.
message GetSandboxEgressRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
}
message GetSandboxEgressResponse {
  string source = 1;
  string declaration = 2;
  string enforcement = 3;
  bool host_allowlist_known = 4 [json_name = "host_allowlist_known"];
  bool isolated = 5;
  repeated SandboxEgressRule rules = 6;
  string host_allowlist_status = 7 [json_name = "host_allowlist_status"];
  SandboxEgressIntent intent = 8;
  string intent_enforcement = 9 [json_name = "intent_enforcement"];
}
// Empty peers allows any destination; empty ports allows all protocols/ports.
message SandboxEgressRule {
  repeated SandboxEgressPeer peers = 1;
  repeated SandboxEgressPort ports = 2;
}
message SandboxEgressPeer {
  SandboxEgressSelector pod_selector = 1 [json_name = "pod_selector"];
  SandboxEgressSelector namespace_selector = 2 [json_name = "namespace_selector"];
  SandboxEgressIPBlock ip_block = 3 [json_name = "ip_block"];
}
message SandboxEgressSelector {
  map<string, string> match_labels = 1 [json_name = "match_labels"];
  repeated SandboxEgressLabelExpression match_expressions = 2 [json_name = "match_expressions"];
}
message SandboxEgressLabelExpression {
  string key = 1;
  string operator = 2;
  repeated string values = 3;
}
message SandboxEgressIPBlock {
  string cidr = 1;
  repeated string except = 2;
}
message SandboxEgressPort {
  string protocol = 1;
  string port_type = 2 [json_name = "port_type"];
  string port = 3;
  int32 end_port = 4 [json_name = "end_port"];
}

// These are durable identity facts, not exact Pod start/end times. Migration
// cannot recover UIDs that were cleared before the history table existed.
message ListSandboxPodHistoryRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
}
message SandboxPodHistory {
  string cluster_id = 1 [json_name = "cluster_id"];
  string namespace = 2;
  string namespace_uid = 3 [json_name = "namespace_uid"];
  string pod_name = 4 [json_name = "pod_name"];
  string pod_uid = 5 [json_name = "pod_uid"];
  string first_recorded_at = 6 [json_name = "first_recorded_at"];
}
message ListSandboxPodHistoryResponse {
  repeated SandboxPodHistory pods = 1;
  bool history_complete_before_migration = 2 [json_name = "history_complete_before_migration"];
}

// Current Sandbox Pod's timestamped stdout/stderr; no persistent retention.
// Resume binds the inclusive since_time to the original pod_uid.
message StreamSandboxLogsRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  uint32 tail_lines = 3 [json_name = "tail_lines"];
  bool follow = 4;
  google.protobuf.Timestamp since_time = 5 [json_name = "since_time"];
  string pod_uid = 6 [json_name = "pod_uid"];
}
message StreamSandboxLogsResponse {
  string kind = 1;
  bytes data = 2;
  string reason = 3;
  string pod_uid = 4 [json_name = "pod_uid"];
}

// Events are from recorded Pod identities and retained by Kubernetes only.
// Message is a safe reason-derived explanation, never raw provider output.
message ListSandboxEventsRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  uint32 page = 3;
  uint32 page_size = 4 [json_name = "page_size"];
}
message SandboxEvent {
  string id = 1;
  string occurred_at = 2 [json_name = "occurred_at"];
  string type = 3;
  string reason = 4;
  string message = 5;
}
message ListSandboxEventsResponse {
  repeated SandboxEvent items = 1;
  int64 total = 2;
  string scope = 3;
  bool history_complete_before_migration = 4 [json_name = "history_complete_before_migration"];
}

// Until a trusted Sandbox-scoped security event source is connected, the
// query returns SANDBOX_SECURITY_EVENT_SOURCE_UNAVAILABLE after authorization
// and Sandbox lookup. Ordinary Pod Warning events are not security events.
message ListSandboxSecurityEventsRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  uint32 page = 3;
  uint32 page_size = 4 [json_name = "page_size"];
  string severity = 5;
}
message SandboxSecurityEvent {
  string id = 1;
  string occurred_at = 2 [json_name = "occurred_at"];
  string severity = 3;
  string event_type = 4 [json_name = "event_type"];
  string description = 5;
}
message ListSandboxSecurityEventsResponse {
  repeated SandboxSecurityEvent items = 1;
  int64 total = 2;
  string source = 3;
  bool history_complete_before_migration = 4 [json_name = "history_complete_before_migration"];
}

// Metadata from the current verified Pod's explicitly configured env only.
// Image ENV and automatic service environment are not included. No values or
// Secret contents are returned; an absent or unverified Pod is an error.
message ListEnvironmentVariablesRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  uint32 page = 3;
  uint32 page_size = 4 [json_name = "page_size"];
}
message SandboxEnvironmentVariable {
  string name = 1;
  string source = 2;
  string secret_ref = 3 [json_name = "secret_ref"];
  string field_ref = 4 [json_name = "field_ref"];
}
message ListEnvironmentVariablesResponse {
  repeated SandboxEnvironmentVariable items = 1;
  int64 total = 2;
}

message OpenTenantSpaceRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  string operation_id = 2 [json_name = "operation_id"];
}
message CloseTenantSpaceRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  string operation_id = 2 [json_name = "operation_id"];
}
message GetTenantSpaceRequest { string tenant_id = 1 [json_name = "tenant_id"]; }
message OpenTenantSpaceResponse { TenantSpace space = 1; }
message CloseTenantSpaceResponse { TenantSpace space = 1; }
message GetTenantSpaceResponse { TenantSpace space = 1; }
message TenantSpace {
  string tenant_id = 1 [json_name = "tenant_id"];
  string operation_id = 2 [json_name = "operation_id"];
  string phase = 3;
  string pending_id = 4 [json_name = "pending_id"];
  string pending_kind = 5 [json_name = "pending_kind"];
}

message RunCodeRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  string run_id = 3 [json_name = "run_id"];
  string idempotency_key = 4 [json_name = "idempotency_key"];
  string language = 5;
  string code = 6;
  string stdin = 7;
  int32 timeout_seconds = 8 [json_name = "timeout_seconds"];
  int64 expected_version = 9 [json_name = "expected_version"];
}
message GetCodeRunRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  string run_id = 3 [json_name = "run_id"];
}
message RunCodeResponse { CodeRun run = 1; }
message GetCodeRunResponse { CodeRun run = 1; }
message CodeRun {
  string run_id = 1 [json_name = "run_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  string state = 3;
  bytes stdout = 4;
  bytes stderr = 5;
  optional int32 exit_code = 6 [json_name = "exit_code"];
  bool truncated = 7;
  bool replayed = 8;
  string reason = 9;
  google.protobuf.Timestamp created_at = 10 [json_name = "created_at"];
  google.protobuf.Timestamp completed_at = 11 [json_name = "completed_at"];
}

message FileEntry {
  string path = 1;
  string kind = 2;
  int64 size_bytes = 3 [json_name = "size_bytes"];
  int64 updated_at_ns = 4 [json_name = "updated_at_ns"];
}
message FileResult {
  string path = 1;
  string kind = 2;
  int64 size_bytes = 3 [json_name = "size_bytes"];
  string content_base64 = 4 [json_name = "content_base64"];
  repeated FileEntry items = 5;
  int64 total = 6;
  string next_cursor = 7 [json_name = "next_cursor"];
}
message FileOperation {
  string operation_id = 1 [json_name = "operation_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  string state = 3;
  string reason = 4;
  bool replayed = 5;
  FileResult result = 6;
}
message QueryFilesRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  string action = 3;
  string path = 4;
  uint32 limit = 5;
  string cursor = 6;
  uint32 page = 7;
  uint32 page_size = 8 [json_name = "page_size"];
}
message QueryFilesResponse { FileResult result = 1; }
message MutateFilesRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  string operation_id = 3 [json_name = "operation_id"];
  string idempotency_key = 4 [json_name = "idempotency_key"];
  int64 expected_version = 5 [json_name = "expected_version"];
  string action = 6;
  string path = 7;
  string content_base64 = 8 [json_name = "content_base64"];
  bool overwrite = 9;
}
message MutateFilesResponse { FileOperation operation = 1; }
message GetFileOperationRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  string operation_id = 3 [json_name = "operation_id"];
}
message GetFileOperationResponse { FileOperation operation = 1; }

message CreateTokenRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  string token_id = 3 [json_name = "token_id"];
  string idempotency_key = 4 [json_name = "idempotency_key"];
  uint32 gov_tenant_id = 5 [json_name = "gov_tenant_id"];
  uint32 issuer_id = 6 [json_name = "issuer_id"];
  repeated string scopes = 7;
  int64 expires_in_seconds = 8 [json_name = "expires_in_seconds"];
}
message CreateTokenResponse { SandboxAccessToken token = 1; }
message SandboxAccessToken {
  string token_id = 1 [json_name = "token_id"];
  string value = 2;
  int64 expires_at = 3 [json_name = "expires_at"];
  repeated string scopes = 4;
  bool replayed = 5;
}
message ValidateTokenRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  string value = 3;
  string required_scope = 4 [json_name = "required_scope"];
}
message ValidateTokenResponse {
  string tenant_id = 1 [json_name = "tenant_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  string token_id = 3 [json_name = "token_id"];
  uint32 gov_tenant_id = 4 [json_name = "gov_tenant_id"];
  uint32 issuer_id = 5 [json_name = "issuer_id"];
  repeated string scopes = 6;
  int64 expires_at = 7 [json_name = "expires_at"];
}
message RevokeTokenRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  string token_id = 3 [json_name = "token_id"];
}
message RevokeTokenResponse { bool revoked = 1; }

// A recorded user declaration only. The current Sandbox implementation does
// not apply a network policy or enforce FQDN restrictions for this intent.
message SandboxEgressIntent {
  string network_egress_policy = 1 [json_name = "network_egress_policy"];
  repeated string egress_allowlist = 2 [json_name = "egress_allowlist"];
}

message CreateSandboxData {
  string name = 1;
  // A tenant or platform registered image reference. A tag is resolved to an
  // immutable digest before accepting the create operation.
  string image_reference = 2 [json_name = "image_reference"];
  string preset_id = 3 [json_name = "preset_id"];
  string workspace_size = 4 [json_name = "workspace_size"];
  string image_id = 5 [json_name = "image_id"];
  string image_scope = 6 [json_name = "image_scope"];
  SandboxEgressIntent egress_intent = 7 [json_name = "egress_intent"];
}

message ResolveCreateSpecRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  // Legacy field; leave empty. Sandbox has no parent instance.
  string instance_id = 2 [json_name = "instance_id"];
  CreateSandboxData data = 3;
  uint32 contract_version = 4 [json_name = "contract_version"];
}

message WorkspaceSpec {
  string mount_path = 1 [json_name = "mount_path"];
  string size = 2;
  string storage_class = 3 [json_name = "storage_class"];
  string reclaim_policy = 4 [json_name = "reclaim_policy"];
}

message ResolveCreateSpecResponse {
  string name = 1;
  string image_reference = 2 [json_name = "image_reference"];
  string image_digest = 3 [json_name = "image_digest"];
  string preset_id = 4 [json_name = "preset_id"];
  string compute_type = 5 [json_name = "compute_type"];
  int64 cpu_millis = 6 [json_name = "cpu_millis"];
  int64 memory_mib = 7 [json_name = "memory_mib"];
  string selection_digest = 8 [json_name = "selection_digest"];
  string cluster_id = 9 [json_name = "cluster_id"];
  string namespace = 10;
  string runtime_class = 11 [json_name = "runtime_class"];
  WorkspaceSpec workspace = 12;
  uint32 contract_version = 13 [json_name = "contract_version"];
  string preset_code = 14 [json_name = "preset_code"];
  string preset_name = 15 [json_name = "preset_name"];
  string spec_digest = 16 [json_name = "spec_digest"];
  // UID of the tenant namespace observed when the specification was frozen.
  string namespace_uid = 17 [json_name = "namespace_uid"];
  string image_id = 18 [json_name = "image_id"];
  string image_scope = 19 [json_name = "image_scope"];
  SandboxEgressIntent egress_intent = 20 [json_name = "egress_intent"];
}

message CommandContext {
  string tenant_id = 1 [json_name = "tenant_id"];
  string resource_id = 2 [json_name = "resource_id"];
  string operation_id = 3 [json_name = "operation_id"];
  // Lowercase SHA-256 digest of the immutable command and frozen spec.
  string request_digest = 4 [json_name = "request_digest"];
}

message AcceptCreateRequest {
  CommandContext context = 1;
  ResolveCreateSpecResponse spec = 2;
  // Legacy field: set only when replaying an already accepted historical command.
  string instance_id = 3 [json_name = "instance_id"];
  string create_intent_digest = 4 [json_name = "create_intent_digest"];
}

// Clone creates a new, independent Sandbox using a trusted frozen create spec.
// expected_version belongs to the source Sandbox, not the new target.
message AcceptSandboxCloneRequest {
  CommandContext context = 1;
  ResolveCreateSpecResponse spec = 2;
  string source_sandbox_id = 3 [json_name = "source_sandbox_id"];
  string checkpoint_id = 4 [json_name = "checkpoint_id"];
  int64 expected_version = 5 [json_name = "expected_version"];
  string create_intent_digest = 6 [json_name = "create_intent_digest"];
}
message AcceptSandboxCloneResponse { OperationAck ack = 1; }

// Restore is asynchronous and requires the target Sandbox to be paused.
message RestoreSandboxCheckpointRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  string checkpoint_id = 3 [json_name = "checkpoint_id"];
  string idempotency_key = 4 [json_name = "idempotency_key"];
  int64 expected_version = 5 [json_name = "expected_version"];
}
message RestoreSandboxCheckpointResponse { OperationAck ack = 1; }

message PauseRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  string idempotency_key = 3 [json_name = "idempotency_key"];
  int64 expected_version = 4 [json_name = "expected_version"];
  // Legacy field; leave empty. Sandbox has no parent instance.
  string instance_id = 5 [json_name = "instance_id"];
}
message ResumeRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  string idempotency_key = 3 [json_name = "idempotency_key"];
  int64 expected_version = 4 [json_name = "expected_version"];
  // Legacy field; leave empty. Sandbox has no parent instance.
  string instance_id = 5 [json_name = "instance_id"];
}
message DeleteRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  string idempotency_key = 3 [json_name = "idempotency_key"];
  int64 expected_version = 4 [json_name = "expected_version"];
  // Legacy field; leave empty. Sandbox has no parent instance.
  string instance_id = 5 [json_name = "instance_id"];
}

message AcceptCreateResponse { OperationAck ack = 1; }
message PauseResponse { OperationAck ack = 1; }
message ResumeResponse { OperationAck ack = 1; }
message DeleteResponse { OperationAck ack = 1; }
message OperationAck {
  string operation_id = 1 [json_name = "operation_id"];
  string resource_id = 2 [json_name = "resource_id"];
  bool accepted = 3;
  bool replayed = 4;
}

message GetSandboxRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  // Legacy field; leave empty. Sandbox has no parent instance.
  string instance_id = 3 [json_name = "instance_id"];
}
message ListSandboxesRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  uint32 page = 2;
  uint32 page_size = 3 [json_name = "page_size"];
  // Legacy field; leave empty. Sandbox has no parent instance.
  string instance_id = 4 [json_name = "instance_id"];
}
message GetSandboxResponse { Sandbox sandbox = 1; }
message ListSandboxesResponse { repeated Sandbox items = 1; int64 total = 2; }
message GetOperationRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  string operation_id = 2 [json_name = "operation_id"];
  // Legacy field; leave empty. Sandbox has no parent instance.
  string instance_id = 3 [json_name = "instance_id"];
}

message ListOperationsRequest {
  string tenant_id = 1 [json_name = "tenant_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  uint32 page = 3;
  uint32 page_size = 4 [json_name = "page_size"];
}
message ListOperationsResponse { repeated Operation items = 1; int64 total = 2; }

message Sandbox {
  string id = 1;
  string tenant_id = 2 [json_name = "tenant_id"];
  // Historical metadata only; does not identify a parent or confer access.
  string instance_id = 3 [json_name = "instance_id"];
  int64 version = 4;
  string desired_state = 5 [json_name = "desired_state"];
  string observed_state = 6 [json_name = "observed_state"];
  string reason = 7;
  string create_operation_id = 8 [json_name = "create_operation_id"];
  string last_operation_id = 9 [json_name = "last_operation_id"];
  SandboxSnapshot snapshot = 10;
  ProviderRefs provider_refs = 11 [json_name = "provider_refs"];
  google.protobuf.Timestamp observed_at = 12 [json_name = "observed_at"];
  string create_intent_digest = 13 [json_name = "create_intent_digest"];
}

message SandboxSnapshot {
  string name = 1;
  string image_reference = 2 [json_name = "image_reference"];
  string preset_id = 3 [json_name = "preset_id"];
  string image_digest = 4 [json_name = "image_digest"];
  int64 cpu_millis = 5 [json_name = "cpu_millis"];
  int64 memory_mib = 6 [json_name = "memory_mib"];
  string compute_type = 7 [json_name = "compute_type"];
