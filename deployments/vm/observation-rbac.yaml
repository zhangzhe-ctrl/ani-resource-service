# Shared read-only power-state observation. These watches never own VM intent
# or replace the existing UID-fenced lifecycle mutation permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ani-resource-vm-observation
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ani-resource-vm-observation-ani-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ani-resource-vm-observation
subjects:
  - kind: ServiceAccount
    name: ani-resource-service
    namespace: ani-system
