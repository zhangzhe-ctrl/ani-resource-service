# Additional rights for the explicitly isolated LB instance. Bind this role to
# that run's ServiceAccount with a uniquely named ClusterRoleBinding.
# The existing egress role remains required; no Service/Deployment spec writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ani-network-load-balancer
rules:
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes, tcproutes, udproutes]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [gateway.envoyproxy.io]
    resources: [backends, backendtrafficpolicies, clienttrafficpolicies, envoypatchpolicies]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses]
    verbs: [get]
  - apiGroups: [gateway.envoyproxy.io]
    resources: [envoyproxies]
    verbs: [get, list, watch]

  # Prefer a namespaced Role granting get to the tenant's selected TLS Secrets.
  # No Secret list/watch or Secret mutation is needed by the listener adapter.

---
# Apply one copy per actual tenant namespace. Never bind Proxy write rights
# cluster-wide or in envoy-gateway-system: lb-common remains platform-owned.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ani-network-load-balancer-proxy
  namespace: REPLACE_TENANT_NAMESPACE
rules:
  - apiGroups: [gateway.envoyproxy.io]
    resources: [envoyproxies]
    verbs: [get, list, watch, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ani-network-load-balancer-proxy
  namespace: REPLACE_TENANT_NAMESPACE
subjects:
  - kind: ServiceAccount
    name: REPLACE_RESOURCE_SERVICE_ACCOUNT
    namespace: REPLACE_RESOURCE_SERVICE_NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ani-network-load-balancer-proxy
