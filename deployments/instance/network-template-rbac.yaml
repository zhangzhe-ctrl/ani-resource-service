# Apply in each managed tenant instance namespace. This writer permission is
# separate from diagnostics and is bound only to the Resource service identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ani-instance-network-template
  namespace: replace-with-instance-namespace
rules:
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ani-instance-network-template-resource
  namespace: replace-with-instance-namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ani-instance-network-template
subjects:
  - kind: ServiceAccount
    name: ani-resource-service
    namespace: ani-system
