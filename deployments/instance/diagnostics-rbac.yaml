# Bind this Role to the Resource service's existing managed Kubernetes identity
# in the configured instance namespace. Never bind it to workspace containers.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ani-instance-diagnostics
  namespace: replace-with-instance-namespace
rules:
  - apiGroups: [kubeflow.org]
    resources: [notebooks]
    verbs: [get]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get]
  - apiGroups: [scheduling.volcano.sh]
    resources: [podgroups]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [list]
